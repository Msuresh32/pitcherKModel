data:
  raw_dir: data/raw
  processed_dir: data/processed_oos2025
  exports_dir: data/exports
  odds_dir: data/odds
  pitcher_logs_file: data/raw/pitcher_game_logs.csv
  team_batting_logs_file: data/raw/team_batting_game_logs.csv
  batter_game_logs_file: data/raw/batter_game_logs.csv
  statcast_pitcher_daily_file: data/raw/statcast_pitcher_daily.csv
  statcast_batter_pitch_type_daily_file: data/raw/statcast_batter_pitch_type_daily.csv
  park_factors_file: data/raw/park_factors.csv
  game_context_logs_file: data/raw/game_context_logs.csv
  probable_pitchers_file: data/raw/probable_pitchers.csv
  today_lineups_file: data/raw/today_lineups.csv
  odds_file: data/odds/historical_pitcher_props_2025.csv
  fangraphs_file: data/raw/fangraphs_pitcher_stats.csv
  statcast_pitcher_advanced_file: data/raw/statcast_pitcher_advanced_daily.csv
  statcast_batter_discipline_file: data/raw/statcast_batter_discipline_daily.csv
  closing_odds_file: data/odds/historical_pitcher_props_2025.csv
training:
  train_start: '2022-01-01'
  train_end: '2024-12-31'      # KEY: walk-forward cutoff — do NOT retrain until 2026 season ends
  backtest_start: '2025-04-01'
  backtest_end: '2025-10-05'
  model_type: ensemble
  random_state: 42
  min_history_games: 3
  cv_splits: 4
  per_target_alpha:
    strikeouts: 0.1
    walks: 0.01
    hits_allowed: 0.0001
  ensemble_blend:
  - 0.7
  - 0.3
features:
  rolling_windows:
  - 3
  - 5
  - 10
  - 20
  top_k_features: 100
betting:
  bankroll: 1000
  max_kelly_fraction: 0.05
  edge_shrink_factor: 0.7

  # PRIMARY FILTER: edge_pct * abs(projection - line) >= threshold
  #
  # V2B benchmark (frozen reference): edge*gap >= 12
  #   WF2025: n=750, ROI=+13.4%, E[$+10c]=$14,387/yr, p<0.001
  #
  # V4 production threshold: edge*gap >= 6
  #   V4 research (2026-06-29): efficient frontier peaks at eg=5-6 for E[profit] maximization.
  #   WF2025: n=1340, ROI=+10.9%, E[$+10c]=$22,210/yr, p<0.001 (vs V2B $14,387 — +54% more profit)
  #   WF2026: n=867,  ROI=+28.5%, p<0.001 (forward test; use 2025 estimate for annual budget)
  #   Threshold sensitivity: edge survives at ±40% perturbation (eg 7.2–16.8) with p<0.001
  #   Monte Carlo (1000 seasons, +10c exchange): 100% P(profitable), 5th pct=$13,656/yr
  #   Rationale: V2B raises selectivity past profit-maximizing point. Every additional bet at
  #              eg≥6 captures WR×exchange_adj per bet in dollar terms. Lowering to 6 adds
  #              ~$7,823/yr at +10c exchange vs keeping the eg≥12 threshold.
  min_edge_pct: 0.0             # No standalone edge floor; edge*gap product handles it
  min_edge_gap_product: 6.0     # V4: lowered from 12.0 to maximize E[annual profit]

  # SEASONAL FILTER: Avoid June (confirmed losing in both 2025 and 2026 OOS)
  # June WF2025 at edge*gap>=6: ROI=-2%, weak across both models.
  # Resume betting in August-September.
  skip_months:
  - 6                           # June: AVOID (confirmed both years)

  # DIRECTION FILTER: All sides (overs AND unders)
  # V3 research found overs-only correct under ROI objective (unders p=0.104 in 2025).
  # V4 research overturns this under PROFIT objective:
  #   All-sides eg>=6: E[$+10c]=$22,210/yr vs overs-only eg>=6: E[$+10c]=$14,273/yr
  #   Under bets add $7,937/yr in expected profit. Under signal confirmed by NB model (p=0.029*).
  #   Re-check under-bet p-value after full 2026 season (Jul-Sep data).
  overs_only: false             # V4: reverted — under bets are profitable for E[profit] objective

  max_edge_pct: 100.0
  max_proj_gap: 99.0
  residual_std_multiplier: 1.25
  default_residual_std:
    strikeouts: 1.8
    walks: 1.0
    hits_allowed: 2.0
  market_distribution:
    strikeouts: negative_binomial
    walks: poisson
    hits_allowed: normal
  apply_bias_correction: true
  min_starts_current_season: 0
  disabled_markets:
  - hits_allowed
  - walks
  main_line_only: true
  main_line_min_odds: -160
  main_line_max_odds: 140
export:
  csv: true
  google_sheets: false
  google_sheet_name: ''
